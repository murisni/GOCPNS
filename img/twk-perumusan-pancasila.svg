<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 627" width="480" height="627" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-label="Garis waktu perumusan Pancasila 1945">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="al" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#475569"/></marker>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker>
</defs>
<rect width="480" height="627" fill="#ffffff"/>
<line x1="106" y1="52.5" x2="106" y2="574.5" stroke="#cbd5e1" stroke-width="3"/>
<text x="8" y="52.5" font-size="13" fill="#7c5cf0" font-weight="800" text-anchor="start">29 Mei 1945</text>
<circle cx="106" cy="52.5" r="7" fill="#fff" stroke="#7c5cf0" stroke-width="3.5"/>
<rect x="122" y="14" width="348" height="77" rx="9" fill="#f3efff" stroke="#7c5cf0" stroke-width="1.3"/>
<text x="133" y="34.5" font-size="14.5" fill="#0f172a" font-weight="800" text-anchor="start">Sidang I BPUPKI — Mr. Moh. Yamin</text>
<text x="133" y="56" font-size="13" fill="#334155" font-weight="500" text-anchor="start">5 asas: peri kebangsaan, kemanusiaan,</text>
<text x="133" y="74" font-size="13" fill="#334155" font-weight="500" text-anchor="start">ketuhanan, kerakyatan, kesejahteraan rakyat</text>
<text x="8" y="139.5" font-size="13" fill="#2563eb" font-weight="800" text-anchor="start">31 Mei 1945</text>
<circle cx="106" cy="139.5" r="7" fill="#fff" stroke="#2563eb" stroke-width="3.5"/>
<rect x="122" y="101" width="348" height="77" rx="9" fill="#eaf1ff" stroke="#2563eb" stroke-width="1.3"/>
<text x="133" y="121.5" font-size="14.5" fill="#0f172a" font-weight="800" text-anchor="start">Prof. Soepomo</text>
<text x="133" y="143" font-size="13" fill="#334155" font-weight="500" text-anchor="start">Negara integralistik: persatuan, kekeluargaan,</text>
<text x="133" y="161" font-size="13" fill="#334155" font-weight="500" text-anchor="start">keseimbangan lahir-batin</text>
<text x="8" y="226.5" font-size="13" fill="#0d9488" font-weight="800" text-anchor="start">1 Juni 1945</text>
<circle cx="106" cy="226.5" r="7" fill="#fff" stroke="#0d9488" stroke-width="3.5"/>
<rect x="122" y="188" width="348" height="77" rx="9" fill="#e6f7f5" stroke="#0d9488" stroke-width="1.3"/>
<text x="133" y="208.5" font-size="14.5" fill="#0f172a" font-weight="800" text-anchor="start">Ir. Soekarno menyebut "Pancasila"</text>
<text x="133" y="230" font-size="13" fill="#334155" font-weight="500" text-anchor="start">Hari Lahir Pancasila. Diperas: Trisila →</text>
<text x="133" y="248" font-size="13" fill="#334155" font-weight="500" text-anchor="start">Ekasila (gotong royong)</text>
<text x="8" y="304.5" font-size="13" fill="#d97706" font-weight="800" text-anchor="start">22 Juni</text>
<text x="8" y="322.5" font-size="13" fill="#d97706" font-weight="800" text-anchor="start">1945</text>
<circle cx="106" cy="313.5" r="7" fill="#fff" stroke="#d97706" stroke-width="3.5"/>
<rect x="122" y="275" width="348" height="77" rx="9" fill="#fff4e0" stroke="#d97706" stroke-width="1.3"/>
<text x="133" y="295.5" font-size="14.5" fill="#0f172a" font-weight="800" text-anchor="start">Panitia Sembilan → Piagam Jakarta</text>
<text x="133" y="317" font-size="13" fill="#334155" font-weight="500" text-anchor="start">Sila 1 masih memuat 7 kata "syariat Islam bagi</text>
<text x="133" y="335" font-size="13" fill="#334155" font-weight="500" text-anchor="start">pemeluknya"</text>
<text x="8" y="391.5" font-size="13" fill="#dc2626" font-weight="800" text-anchor="start">10–17 Juli</text>
<text x="8" y="409.5" font-size="13" fill="#dc2626" font-weight="800" text-anchor="start">1945</text>
<circle cx="106" cy="400.5" r="7" fill="#fff" stroke="#dc2626" stroke-width="3.5"/>
<rect x="122" y="362" width="348" height="77" rx="9" fill="#feecec" stroke="#dc2626" stroke-width="1.3"/>
<text x="133" y="382.5" font-size="14.5" fill="#0f172a" font-weight="800" text-anchor="start">Sidang II BPUPKI</text>
<text x="133" y="404" font-size="13" fill="#334155" font-weight="500" text-anchor="start">Membahas rancangan UUD (ketua BPUPKI: dr.</text>
<text x="133" y="422" font-size="13" fill="#334155" font-weight="500" text-anchor="start">Radjiman Wedyodiningrat)</text>
<text x="8" y="487.5" font-size="13" fill="#db2777" font-weight="800" text-anchor="start">17 Agt 1945</text>
<circle cx="106" cy="487.5" r="7" fill="#fff" stroke="#db2777" stroke-width="3.5"/>
<rect x="122" y="449" width="348" height="77" rx="9" fill="#fdebf4" stroke="#db2777" stroke-width="1.3"/>
<text x="133" y="469.5" font-size="14.5" fill="#0f172a" font-weight="800" text-anchor="start">Proklamasi Kemerdekaan</text>
<text x="133" y="491" font-size="13" fill="#334155" font-weight="500" text-anchor="start">Dibacakan Soekarno–Hatta, Jl. Pegangsaan Timur</text>
<text x="133" y="509" font-size="13" fill="#334155" font-weight="500" text-anchor="start">56</text>
<text x="8" y="574.5" font-size="13" fill="#4f46e5" font-weight="800" text-anchor="start">18 Agt 1945</text>
<circle cx="106" cy="574.5" r="7" fill="#fff" stroke="#4f46e5" stroke-width="3.5"/>
<rect x="122" y="536" width="348" height="77" rx="9" fill="#eceeff" stroke="#4f46e5" stroke-width="1.3"/>
<text x="133" y="556.5" font-size="14.5" fill="#0f172a" font-weight="800" text-anchor="start">Sidang PPKI</text>
<text x="133" y="578" font-size="13" fill="#334155" font-weight="500" text-anchor="start">Mengesahkan UUD 1945 &amp; Pancasila; 7 kata</text>
<text x="133" y="596" font-size="13" fill="#334155" font-weight="500" text-anchor="start">dihapus → "Ketuhanan Yang Maha Esa"</text>
</svg>