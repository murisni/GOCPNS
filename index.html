<!DOCTYPE html>
<html lang="id" data-theme="cpns">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CAT CPNS">
  <meta name="format-detection" content="telephone=no">
  <title>CAT CPNS — Materi, Latihan SKD &amp; SKB</title>
  <meta name="description" content="Belajar materi, latihan paket soal SKD dan SKB CPNS dengan simulasi CAT.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="min-h-dvh font-sans antialiased">
  <div id="app"></div>

  <!-- Dialog bersama (diisi lewat JS) -->
  <dialog id="dlg-confirm" class="modal modal-bottom sm:modal-middle">
    <div class="modal-box max-w-sm">
      <h3 class="text-lg font-bold" id="confirm-title"></h3>
      <p class="py-3 text-sm text-base-content/75" id="confirm-text"></p>
      <div class="modal-action act-stack">
        <button class="btn btn-ghost" id="confirm-cancel">Batal</button>
        <button class="btn btn-primary" id="confirm-ok">Ya</button>
      </div>
    </div>
    <form method="dialog" class="modal-backdrop"><button aria-label="Tutup">tutup</button></form>
  </dialog>

  <dialog id="dlg-start" class="modal modal-bottom sm:modal-middle"></dialog>
  <dialog id="dlg-result" class="modal modal-bottom sm:modal-middle"></dialog>
  <dialog id="dlg-nums" class="modal modal-bottom"></dialog>
  <dialog id="dlg-db" class="modal modal-bottom sm:modal-middle"></dialog>
  <dialog id="dlg-menu" class="modal modal-bottom sm:modal-middle"></dialog>

  <!-- 1) inti bank soal  2) file bank soal  3) materi  4) aplikasi -->
  <script src="js/db-core.js"></script>
  <script src="db/skd/db_skd_twk.js"></script>
  <script src="db/skd/db_skd_tiu.js"></script>
  <script src="db/skd/db_skd_tkp.js"></script>
  <script src="db/skb/db_skb_prakom.js"></script>
  <script src="db/skb/db_skb_kesehatan.js"></script>
  <script src="db/skb/db_skb_hukum.js"></script>
  <script src="db/skb/db_skb_keuangan.js"></script>
  <script src="db/skb/db_skb_pendidikan.js"></script>
  <script src="js/materi.js"></script>
  <script src="js/app.js"></script>

  <!-- PWA: modal ajakan pasang aplikasi + tombol cadangan + service worker (hanya jalan di HTTPS / localhost) -->
  <dialog id="dlg-pwa" class="modal modal-bottom sm:modal-middle">
    <div class="modal-box max-w-sm text-center outline-none" tabindex="-1" autofocus>
      <img src="icons/icon-192.png" alt="" class="mx-auto h-16 w-16 rounded-2xl shadow-md">
      <h3 class="mt-4 text-lg font-extrabold text-neutral">Pasang CAT CPNS di perangkatmu</h3>
      <p class="mt-1 text-sm text-base-content/70">Buka lebih cepat dari layar utama, tampil layar penuh, dan tetap bisa dipakai tanpa internet.</p>
      <p id="pwa-ios" hidden class="mt-3 rounded-xl bg-base-200 p-3 text-left text-sm">Ketuk ikon <b>Bagikan</b> (kotak dengan panah ke atas) di browser, lalu pilih <b>Tambah ke Layar Utama</b>.</p>
      <div class="modal-action act-stack">
        <button id="pwa-later" class="btn btn-ghost">Nanti saja</button>
        <button id="pwa-go" class="btn btn-primary">Pasang sekarang</button>
      </div>
    </div>
    <form method="dialog" class="modal-backdrop"><button aria-label="Tutup">tutup</button></form>
  </dialog>
  <button id="pwa-install" hidden class="btn btn-primary btn-sm fixed z-50 rounded-full shadow-lg" style="right:1rem;bottom:calc(5.25rem + env(safe-area-inset-bottom))">Pasang aplikasi</button>
  <script>
    (function () {
      var $ = function (id) { return document.getElementById(id); };
      var btn = $('pwa-install'), dlg = $('dlg-pwa'), go = $('pwa-go'), evt = null, KEY = 'pwa-tunda';
      var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
      var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      function ditunda() { try { return Date.now() < Number(localStorage.getItem(KEY) || 0); } catch (e) { return false; } }
      function tunda(hari) { try { localStorage.setItem(KEY, String(Date.now() + hari * 864e5)); } catch (e) {} }
      function diUjian() { return location.hash.indexOf('#/ujian') === 0; }
      function tawarkan() {
        if (standalone || ditunda() || diUjian() || document.querySelector('dialog[open]')) return;
        if (!evt && !ios) return;
        dlg.showModal();
      }
      if (ios) { $('pwa-ios').hidden = false; go.hidden = true; $('pwa-later').textContent = 'Mengerti'; }
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault(); evt = e;
        if (!diUjian()) btn.hidden = false;
        setTimeout(tawarkan, 2500);
      });
      if (ios && !standalone) setTimeout(tawarkan, 3500);
      window.addEventListener('hashchange', function () { btn.hidden = !evt || diUjian(); });
      function pasang() {
        if (!evt) return;
        if (dlg.open) dlg.close();
        evt.prompt();
        evt.userChoice.then(function (r) { if (r && r.outcome !== 'accepted') tunda(7); evt = null; btn.hidden = true; });
      }
      go.addEventListener('click', pasang);
      btn.addEventListener('click', pasang);
      $('pwa-later').addEventListener('click', function () { dlg.close(); });
      dlg.addEventListener('close', function () { tunda(3); });   // ditutup lewat tombol/latar -> jangan muncul lagi 3 hari
      window.addEventListener('appinstalled', function () { evt = null; btn.hidden = true; if (dlg.open) dlg.close(); });
      if ('serviceWorker' in navigator && location.protocol !== 'file:') {
        window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
      }
    })();
  </script>
</body>
</html>
